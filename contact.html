<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nigeria Heritage: Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Nigeria Heritage</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="statues.html">Statues</a>
      <a href="culture.html">Cultures</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <section>
    <h2>Contact us</h2>
    <p class="intro">Send us a message and we will reply as soon as we can.</p>
    <form id="contact-form">
      <input type="text" id="name" placeholder="Your name">
      <input type="email" id="email" placeholder="Your email">
      <textarea id="message" rows="4" placeholder="Your message"></textarea>
      <button type="submit" class="button">Send message</button>
    </form>
    <p id="form-message"></p>
  </section>

  <footer>
    <p>© <span id="year"></span> Nigeria Heritage</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
